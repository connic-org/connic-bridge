name: Publish to PyPI

on:
  release:
    types: [published]
  push:
    branches:
      - main
    paths:
      - 'pyproject.toml'

permissions:
  contents: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests with coverage
        run: python -m pytest --cov=connic_bridge --cov-report=term-missing

  check-and-release:
    needs: [test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.check_tag.outputs.should_publish }}
      version: ${{ steps.extract.outputs.version }}
      raw_version: ${{ steps.extract.outputs.raw_version }}
      major_minor: ${{ steps.extract.outputs.major_minor }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Extract version from pyproject.toml
        id: extract
        run: |
          VERSION=$(grep -E '^version = ' pyproject.toml | cut -d '"' -f 2)
          echo "version=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "raw_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "major_minor=$(echo "$VERSION" | cut -d. -f1-2)" >> "$GITHUB_OUTPUT"

      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse "${{ steps.extract.outputs.version }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.extract.outputs.version }} already exists."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag ${{ steps.extract.outputs.version }} does not exist. Creating release..."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.check_tag.outputs.should_publish == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.extract.outputs.version }}
          name: Release ${{ steps.extract.outputs.version }}
          generate_release_notes: true

  build:
    needs: [test, check-and-release]
    if: |
      always() && !failure() && !cancelled() &&
      (github.event_name == 'release' || needs.check-and-release.outputs.should_publish == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Build distributions
        run: uv build
      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-dists
          path: dist/

  publish:
    runs-on: ubuntu-latest
    needs: [build, check-and-release]
    if: |
      always() && !failure() && !cancelled() &&
      (github.event_name == 'release' || needs.check-and-release.outputs.should_publish == 'true')
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/connic-bridge
    steps:
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-dists
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1

  docker:
    runs-on: ubuntu-latest
    needs: [build, check-and-release]
    if: |
      always() && !failure() && !cancelled() &&
      github.event_name == 'push' && needs.check-and-release.outputs.should_publish == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: connicorg/bridge
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.check-and-release.outputs.raw_version }}
            type=raw,value=${{ needs.check-and-release.outputs.major_minor }}

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
